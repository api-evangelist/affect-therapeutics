aid: affect-therapeutics
name: Affect Therapeutics
description: 'Affect Therapeutics (operating as "Affect") is a US digital health company founded in
  2020 that delivers app-based outpatient and intensive outpatient treatment for substance use and
  mental health disorders. Care is delivered entirely through a mobile application on iOS and Android
  and combines contingency management, cognitive behavioral therapy, medication-assisted treatment,
  psychiatry, peer support and care coordination. The program treats alcohol, opioid, methamphetamine,
  cocaine, cannabis and prescription stimulant use disorders alongside anxiety, depression, OCD, PTSD,
  bipolar disorder and postpartum depression, and is offered to Medicaid and commercial insurance
  members across multiple US states. Affect is CARF-accredited and operates as a HIPAA-covered
  telehealth provider. It publishes no public developer program, API documentation, or machine-readable
  specification; its software is delivered exclusively as an end-user patient application.'
