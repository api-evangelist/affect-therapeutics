  reason: no-developer-program
  detail: >-
    Affect ships only an end-user patient app (iOS/Android) — its one API host,
    api.affect.com, is a private Django backend on Aptible whose root serves an HTML
    "Login Required" page with meta robots=noindex, and every contract path there
    (/openapi.json, /swagger.json, /graphql, /docs, /.well-known/*) returns a real 404
    confirmed against a control path; there is no developer portal, no partner API, and
    the company's five public GitHub repos are all forks of third-party projects.
